<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style_original.css">
    <link rel="icon" type="image/png" href="Assets/img/Fttall.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T~tall contact</title>
</head>
<body style="background:#000;">
  <div class="enquiry-whole">
    <header style="background:#000;">
      <div class="whole-nova" style="background:#000;">

        <div class="logo-container-equiry">
          <img src="Assets/img/wttall.png" alt="T-tall" height="20%" width="15%" class="logo">

          <nav class="border-equiry" style="background:#000;">
            <ul>
              <a href="index.html"><b>Home</b></a>
              <a href="services.html"><b>Store</b></a>
              <a href="contact.html"><b>Become a Barber</b></a>
              <a href="about.html"><b>#TtallGiveBack</b></a>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <!-- Form -->
<center>
    <section class="form-container-equiry" aria-label="Enquiry form" style="margin-top:220px;">

      <h2 style="margin:0; font-size:22px; color:#fff;">Send us an enquiry</h2>
      <p style="margin:0; color:#bdbdbd; font-size:13px;">
        We’ll get back to you as soon as possible.
      </p>

      <form class="form-equiry" action="#" method="post">
        <div class="form-group-equiry">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" placeholder="Your name" required minlength="2" />
        </div>

        <div class="form-group-equiry">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </div>

        <div class="form-group-equiry">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" type="tel" placeholder="e.g. +27 79 631 6135" required minlength="8" />
        </div>

        <div class="form-group-equiry">
          <label for="service">What do you need?</label>
          <select id="service" name="service" required
            style="width:100%; padding:12px 16px; border-radius:8px; color:#fff; background:transparent; border:1px solid #414141; font-family:inherit;">
            <option value="" disabled selected>Select a service</option>
            <option value="haircut">Haircut</option>
            <option value="fade">Fade</option>
            <option value="dye">Dye / Colour</option>
            <option value="beard">Beard / Line-up</option>
            <option value="housecall">House Call</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group-equiry">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us about your enquiry..." required minlength="10"></textarea>
        </div>

        <button class="form-submit-btn-equiry" type="submit">
          <span style="font-size:14px;">Submit enquiry</span>
          <i class="fa-solid fa-paper-plane" aria-hidden="true" style="margin-left:4px;"></i>
        </button>
      </form>
    </section>
</center>
    <hr>


    <div class="barber-media-equiry">
      <i class="fa-brands fa-whatsapp" style="color: rgb(255, 255, 255);"><a href="https://wa.me/27796316135"></a></i></br>
      <i class="fa-solid fa-phone"><a href="https://wa.me/27796316135"> </a></i>
      <i class="fa-brands fa-tiktok"><a href="https://www.tiktok.com/@ttall_haircutss_rsa?_r=1&_t=ZS-95e6uFXXb5U"></a></i><br>
      <i class="fa-brands fa-facebook-f"><a href="https://www.facebook.com/share/1biPkPqtfv/"></a></i><br>
      <i class="fa-brands fa-instagram"><a href="https://www.instagram.com/t_tall_haircuts_rsa?igsh=NGIzNXk1amJyM3Mw"> </a></i><br>
    </div>

    <div class="barber-number-equiry">
      <center>Call: +27 79 631 6135</center>
    </div>

    <!--barber footer-->
    <footer>
      <div class="footerb-bottom-equiry">
        <center><p>©2026 Studio. Ttall Haircuts. All Rights Reserved. Built By Panda.M</p></center>
      </div>
    </footer>
  </div>
<script defer src="Assets/Js/app.js"></script>
</body>
</html>
